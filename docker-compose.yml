
# Unified Neuro-Genetic Maintainability Stack (FastAPI + React)
#
# Operations:
#   docker-compose up --build             # Start Backend and UI
#
# Research Workflows:
#   docker-compose run --rm research ./scripts/research.sh --replicate-paper
#
# URLS:
#   Frontend (React): http://localhost:5173
#   Backend (API):    http://localhost:8000/docs

services:
  # ── Backend API ───────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./test_repos:/app/test_repos
      - ./src:/app/src
      - ./api:/app/api
      - ./main.py:/app/main.py
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - OMP_NUM_THREADS=1
      - KMP_DUPLICATE_LIB_OK=TRUE
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Research CLI ──────────────────────────────────────────────────────────
  research:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/app/data
      - ./test_repos:/app/test_repos
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./main.py:/app/main.py
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - OMP_NUM_THREADS=1
      - KMP_DUPLICATE_LIB_OK=TRUE
    entrypoint: ["/bin/bash"]

  # ── React Frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.ui
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    command: npm run dev -- --host 0.0.0.0
